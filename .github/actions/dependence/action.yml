name: "dependence-setup"
description: "environment dependence setup"
inputs:
    python-version:
        description: "python version"
        required: false
        default: 3.11
    java:
        description: "java version"
        required: false
        default: 8
    os:
        description: "running environment"
        required: false
        default: ubuntu-latest
    scope:
        description: "partial dependency required"
        required: false
        default: all
        # all: setup all
    docker-required:
        description: "is docker needed in this test"
        required: false
        default: "false"
    free-thread-python-required:
        description: "is free-threading python needed"
        required: false
        default: "false"
    iginx-conda-flag:
        description: "whether to use conda"
        required: false
        default: "false"
    iginx-conda-env:
        description: "conda env name"
        required: false
    start-single-iginx:
        description: "is only one iginx started in this test"
        required: false
        default: "true"

runs:
    using: "composite"
    steps:
        - if: runner.os == 'Linux'
          name: Free Disk Space
          shell: bash
          run: |
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
              sudo docker image prune --all --force || true

        # need to set up timezone and enlarge JVM heap size manually on windows
        - if: runner.os == 'Windows'
          name: Set Dynamic Timezone
          shell: cmd
          run: |
              tzutil /s "China Standard Time"
              echo "JAVA_OPTS=-Xmx4g -Xms2g" >> %GITHUB_ENV%

        # after this setup, every shell using login mode will be in conda env
        # conda should be set at very beginning because this action will delete ~/.bashrc & ~/.bash_profile
        # and regenerate them by initializing conda
        - if: inputs.scope=='all' && inputs.iginx-conda-flag == 'true'
          name: Setup Miniconda
          uses: conda-incubator/setup-miniconda@v4
          with:
              miniconda-version: ${{ inputs.conda-version }}
              # 3.11.15 is the conda build of the last green run; 3.11.18 (Oct 2026) came with
              # native crashes (SIGSEGV in libpython) under pemja
              python-version: ${{ inputs.python-version == '3.11' && '3.11.15' || inputs.python-version }}
              activate-environment: ${{ inputs.iginx-conda-env }}
              channel-priority: strict
              run-post: "false"

        # we use a patched version of lima(slower) because colima cannot start on M1 chips and the docker task is lightweight.
        - if: runner.os == 'macOS' &&  inputs.docker-required=='true'
          name: Install Docker on MacOS
          shell: bash
          run: |
              brew update
              brew install docker qemu lima
              LIMACTL_PATH=$(brew --prefix)/bin/limactl
              COLIMA_PATH=$(brew --prefix)/bin/colima
              sudo curl --retry 5 --retry-delay 5 --retry-all-errors -LO https://github.com/abiosoft/colima/releases/download/v0.8.1/colima-Darwin-arm64
              sudo install colima-Darwin-arm64 $COLIMA_PATH && sudo chmod +x $COLIMA_PATH
              sudo curl --retry 5 --retry-delay 5 --retry-all-errors -L -o $LIMACTL_PATH https://github.com/mikekazakov/lima-nohvf/raw/master/limactl && sudo chmod +x $LIMACTL_PATH
              colima start --network-address --arch arm64 --vm-type=qemu
              docker --version

        - if: inputs.scope=='all' && inputs.iginx-conda-flag != 'true'
          name: Set up Python ${{ inputs.python-version }}
          uses: actions/setup-python@v6
          with:
              python-version: ${{ inputs.python-version }}
              cache: "pip" # caching pip dependencies
              cache-dependency-path: |
                  .github/python/requirements.txt
                  .github/python/constraints.txt

        # when using login mode shell, setup-python does not take effect.
        # thus manually add python path to PATH
        - if: inputs.scope=='all' && inputs.iginx-conda-flag != 'true'
          name: Add System Python to PATH
          shell: bash
          run: |
              PYTHON_PATH=$(dirname $(which python))
              echo $PYTHON_PATH
              echo "IGINX_PYTHON_PATH=$PYTHON_PATH" >> $GITHUB_ENV

        - if: inputs.scope=='all'
          name: Install Python dependencies
          shell: bash -el {0}
          run: |
              if [ ! -z "$IGINX_PYTHON_PATH" ]; then
                export PATH="$IGINX_PYTHON_PATH:$PATH"
              fi
              echo $PATH
              which python
              python -m pip install --upgrade pip
              # package lists live in .github/python (see the comments there)
              pip install -r "$GITHUB_WORKSPACE/.github/python/requirements.txt" -c "$GITHUB_WORKSPACE/.github/python/constraints.txt"

        - if: inputs.free-thread-python-required=='true'
          name: Install free-thread python
          uses: ./.github/actions/service/freeThreadConda
          with:
              iginx-conda-env: ${{ inputs.iginx-conda-env }}

        - name: Set up JDK ${{ inputs.java }}
          uses: actions/setup-java@v5
          with:
              java-version: ${{ inputs.java }}
              distribution: ${{ runner.os == 'macOS' && matrix.java == '8' && 'liberica' || 'temurin' }}
              cache: "maven"

        # the macOS image's ~/.bashrc exports JAVA_HOME for its default JDK (21), so steps
        # using a login shell (bash -el) would silently switch away from the JDK chosen above.
        # A login shell reads only the first of ~/.bash_profile, ~/.bash_login and ~/.profile,
        # and setup-miniconda moves ~/.bash_profile to ~/.profile, so append to the file that
        # exists and never create a new one (that would hide the conda setup in ~/.profile).
        - if: runner.os == 'macOS'
          name: Keep JDK ${{ inputs.java }} in login shells
          shell: bash
          run: |
              python_before=$(bash -el -c 'command -v python3 || true')
              login_rc=""
              for f in ~/.bash_profile ~/.bash_login ~/.profile; do
                if [ -f "$f" ]; then login_rc="$f"; break; fi
              done
              rc_files="${login_rc:-$HOME/.bash_profile}"
              if [ -f ~/.bashrc ]; then rc_files="$rc_files $HOME/.bashrc"; fi
              for rc in $rc_files; do
                echo "appending JAVA_HOME to $rc"
                {
                  echo ""
                  echo "# added by IGinX CI: keep the JDK chosen by setup-java"
                  echo "export JAVA_HOME=\"$JAVA_HOME\""
                  echo "export PATH=\"\$JAVA_HOME/bin:\$PATH\""
                } >> "$rc"
              done
              bash -el -c 'echo "login shell JAVA_HOME=$JAVA_HOME"; java -version'
              python_after=$(bash -el -c 'command -v python3 || true')
              echo "login shell python3: $python_before -> $python_after"
              if [ "$python_before" != "$python_after" ]; then
                echo "::error::changing the shell profile switched python3 in login shells"
                exit 1
              fi

        # Maven Central occasionally resets connections; retry downloads instead of failing the job
        - name: Make Maven downloads retry
          shell: bash
          run: |
              echo "MAVEN_OPTS=${MAVEN_OPTS:+$MAVEN_OPTS }-Daether.connector.http.retryHandler.count=5 -Daether.connector.http.retryHandler.requestSentEnabled=true -Dmaven.wagon.http.retryHandler.count=5" >> $GITHUB_ENV

        - name: Check Java & Python Version
          shell: bash
          run: |
              java -version
              which java
              python --version
              which python

        - name: Check Java & Python Version in Conda and set conda env name
          if: inputs.iginx-conda-flag == 'true'
          shell: bash -el {0}
          run: |
              java -version
              which java
              python --version
              which python
              # to access conda env in scripts
              echo "IGINX_CONDA_ENV=${{ inputs.iginx-conda-env }}" >> $GITHUB_ENV
              echo "IGINX_CONDA_FLAG=${{ inputs.iginx-conda-flag }}" >> $GITHUB_ENV

        - name: Get project info
          id: project
          uses: ./.github/actions/project

        - name: Set up environment variable
          shell: bash
          run: |
              VERSION=${{ steps.project.outputs.version }}
              echo "VERSION=${VERSION}" >> $GITHUB_ENV
              PROJECT_ROOT=${{ steps.project.outputs.workspace }}
              echo "PROJECT_ROOT=${PROJECT_ROOT}" >> $GITHUB_ENV
              echo "SERVICE_DIR=${PROJECT_ROOT}/.github/actions/service" >> $GITHUB_ENV
              if [ "${{ inputs.start-single-iginx }}" == "true" ]; then
                  echo "IGINX_HOME=${PROJECT_ROOT}/core/target/iginx-core-${VERSION}" >> $GITHUB_ENV
              fi
