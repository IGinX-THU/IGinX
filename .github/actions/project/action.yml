name: "project"
description: "read project information from pom.xml"
inputs:
    workspace:
        description: "file paths delimited by space"
        required: false
        default: ${{ github.workspace }}

outputs:
    version:
        description: "project version"
        value: ${{ steps.info.outputs.version }}
    workspace:
        description: "absolute workspace path"
        value: ${{ steps.workspace.outputs.workspace }}

runs:
    using: "composite"
    steps:
        - name: "information"
          id: info
          shell: bash
          working-directory: ${{ inputs.workspace }}
          run: |
              python - <<'PY'
              import os, xml.etree.ElementTree as ET
              root = ET.parse('pom.xml').getroot()
              ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
              version = root.findtext('m:version', namespaces=ns)
              if version == '${revision}':
                  version = root.findtext('m:properties/m:revision', namespaces=ns)
              if not version or '${' in version:
                  raise SystemExit('Cannot resolve project version from pom.xml')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('version=' + version + '\n')
              PY

        - name: "absolute workspace path"
          id: workspace
          shell: bash
          working-directory: ${{ inputs.workspace }}
          run: |
              # if git bash for windows
              if [ "$RUNNER_OS" == "Windows" ]; then
                ABSOLUTE_WORKSPACE=$(pwd -W)
              else
                ABSOLUTE_WORKSPACE=$(pwd)
              fi
              echo "workspace=$ABSOLUTE_WORKSPACE" >> $GITHUB_OUTPUT
